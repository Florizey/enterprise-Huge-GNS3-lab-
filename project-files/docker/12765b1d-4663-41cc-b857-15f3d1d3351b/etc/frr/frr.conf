frr version 10.3
frr defaults traditional
hostname FRRDocker-3
log syslog informational
service integrated-vtysh-config
!
ip route 0.0.0.0/0 192.168.122.1
ip route 192.168.1.0/24 192.168.10.1
ip route 192.168.11.0/24 192.168.10.1
!
interface eth0
 ip address 192.168.2.10/24
exit
!
interface eth1
 ip address 192.168.10.2/24
exit
!
interface eth2
 ip address 192.168.122.2/24
exit
!
router ospf
 network 192.168.2.0/24 area 0
 network 192.168.10.0/24 area 0
 network 192.168.122.0/24 area 0
 default-information originate
exit
!
segment-routing
 traffic-eng
 exit
exit
!
