frr version 10.3
frr defaults traditional
hostname a
log syslog informational
service integrated-vtysh-config
!
ip route 0.0.0.0/0 192.168.122.1
!
interface eth0
 ip address 172.16.0.1/24
exit
!
interface eth1
 ip address 10.0.0.1/24
exit
!
interface eth3
 ip address 192.168.0.5/24
exit
!
router ospf
 network 10.0.0.0/24 area 1
 network 172.16.0.0/24 area 0
 network 192.168.0.0/24 area 2
exit
!
segment-routing
 traffic-eng
 exit
exit
!
